# Netlify config for the Stonewater / RGA price app.
# This file lives INSIDE the app subfolder. In the Netlify site settings,
# set "Base directory" to:  stonewater-price-app
# Netlify then reads this file, and the paths below are relative to that base.

[build]
  # Publish the static app folder.
  publish = "site"
  # 1. build-catalog: read the prices from Supabase ONCE and write
  #    site/prices.json (public, customer prices) and
  #    netlify/generated/catalog-full.mjs (bundled into prices-full). If
  #    Supabase can't be read, the build fails and the last deploy stays live.
  # 2. stamp-cache: fresh service-worker cache version per deploy.
  command = "node scripts/build-catalog.mjs && node scripts/stamp-cache.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Icons. NOT `immutable`: these filenames are stable (icon-192.png keeps its
# name across releases), and `immutable` tells the browser never to revalidate,
# so a redesigned icon would be invisible to existing users for a year. That is
# exactly what happened in v2.3.0. `must-revalidate` keeps them cheap — the
# browser still gets a 304 on an unchanged file — while letting a real change
# land. Icon URLs also carry ?v=<version>; bump it whenever the artwork changes.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Revalidated on every load (cheap 304 from the CDN), so a Publish shows up on
# the next reload.
[[headers]]
  for = "/prices.json"
  [headers.values]
    Cache-Control = "no-cache"

# /api/prices-full   -> every price, for the unlocked views (passcode-checked)
# /api/admin-prices  -> admin-screen reads/writes/publish (passcode-checked)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
