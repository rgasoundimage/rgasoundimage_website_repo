# Netlify config for the Stonewater / RGA price app.
# This file lives INSIDE the app subfolder. In the Netlify site settings,
# set "Base directory" to:  stonewater-price-app
# Netlify then reads this file, and the paths below are relative to that base.

[build]
  # Publish the static app folder.
  publish = "site"
  # The only build step: stamp a fresh service-worker cache version
  # (from the commit SHA) so redeploys are never stale. No Python needed here —
  # prices.json is generated locally and committed.
  command = "node scripts/stamp-cache.mjs"

[build.environment]
  NODE_VERSION = "20"

# Icons. NOT `immutable`: these filenames are stable (icon-192.png keeps its
# name across releases), and `immutable` tells the browser never to revalidate,
# so a redesigned icon would be invisible to existing users for a year. That is
# exactly what happened in v2.3.0. `must-revalidate` keeps them cheap — the
# browser still gets a 304 on an unchanged file — while letting a real change
# land. Icon URLs also carry ?v=<version>; bump it whenever the artwork changes.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/prices.json"
  [headers.values]
    Cache-Control = "no-cache"
